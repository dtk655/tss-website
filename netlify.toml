[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the test site out of Google until launch. REMOVE this block when
# trafficsafetyservice.com points at this site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The WATERCADE page is the full watercadebarrier.com experience, served from /watercade/
[[redirects]]
  from = "/pages/water-filled-barrier"
  to = "/watercade/"
  status = 301

[[redirects]]
  from = "/watercade"
  to = "/watercade/"
  status = 301
